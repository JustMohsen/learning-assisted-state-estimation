[project]
name = "learning-assisted-state-estimation"
version = "0.1.0"
description = "Physics-based Kalman filter with a causal GRU that adapts bias drift, wheel-model error and sensor trust, trained end to end through the filter (NCLT)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mohsen Mutasem" }]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
    "types-tqdm>=4.70.0.20261106",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lase"]

# PyTorch: default PyPI wheels on macOS; CPU-only wheels on Linux (CI) to avoid CUDA downloads.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# pep8-naming (N) is deliberately not enabled: math-style names such as C_wb, P, F, H, K are conventions here.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lase"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lase"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = [
    "validation: slower checks against independent references (run explicitly: pytest tests/validation)",
]

[tool.coverage.run]
source = ["lase"]
