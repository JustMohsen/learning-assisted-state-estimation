# Analytical ESKF baseline (method A), tuned on TRAINING days only (Phase 3, step 9;
# reports/phase3_baseline/tuning_*.csv). Values not listed use the FilterConfig defaults
# (lase.filter.params): FOG noise from the KVH datasheet, IMU gyro 0.002 rad/s/sqrt(Hz), etc.
name: eskf-baseline
noise:
  acc_noise_density: 0.05      # m/s^2/sqrt(Hz); flat optimum 0.05-0.2
gnss:
  sigma_m: 5.0                 # inflated for time-correlated GPS error
  min_interval_s: 1.0          # 1 Hz GPS updates
  recovery_after_s: 300.0      # 90 s accepted gross GPS episodes (2012-02-04: 112 m jump)
wheel:
  sigma_mps: 0.15
nonholonomic:
  enabled: true                # optional analytical constraint; scope decision pending with the user
  sigma_lateral_mps: 0.1
  sigma_vertical_mps: 0.1
