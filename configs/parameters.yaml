# =============================================================================
# Project parameters: every tunable value, with what it does and where it came from.
# =============================================================================
# Loaded by lase.parameters.load_parameters(). Experiments override a subset with small
# files in configs/experiments/ (deep-merged on top). Rule (CONVENTIONS.md): every value
# we decide on is a named, commented parameter here, never a number in code.
# Not here: measured physical facts (configs/data/nclt_calibration.yaml) and simulator
# scenarios (configs/sim/).
# Sources: [tuned] training-day grid search (reports/phase3_baseline/tuning_*.csv);
# [datasheet]; [measured] Phase 1/2 data analysis; [design] engineering choice.

filter:
  name: eskf-baseline                # label used in reports

  noise:                             # continuous-time process noise (propagation)
    acc_noise_density: 0.05          # m/s^2/sqrt(Hz) accelerometer white noise incl. Segway vibration [tuned; flat optimum 0.05-0.2]
    gyr_noise_density: 0.002         # rad/s/sqrt(Hz) MEMS gyro white noise [design, pessimistic vs datasheet]
    fog_angle_random_walk: 2.0e-5    # rad/sqrt(s) FOG noise; KVH DSP-3000 ARW 0.0667 deg/sqrt(h) [datasheet]
    acc_bias_rw: 1.0e-4              # m/s^2/sqrt(s) accelerometer bias random walk [design]
    gyr_bias_rw: 1.0e-5              # rad/s/sqrt(s) gyro bias random walk [design]
    fog_bias_rw: 1.0e-6              # rad/s/sqrt(s) FOG bias random walk: within-session (temperature) change ~5-20 deg/h per 30-60 min (R5); 2e-6 worse [tuned, R7a]
    wheel_scale_rw: 0.0              # 1/sqrt(s) wheel-scale random walk; 0 = no drift within a session [design; R6]

  prior:                             # initial 1-sigma uncertainties (common initial-pose prior)
    pos_m: 0.5                       # m initial position
    vel_mps: 0.3                     # m/s initial velocity (from wheels)
    att_rad: [0.02, 0.02, 0.02]      # rad initial roll, pitch, yaw
    acc_bias_mps2: 0.1               # m/s^2 initial accelerometer bias
    gyr_bias_radps: 0.01             # rad/s initial gyro bias
    fog_bias_radps: 1.0e-4           # rad/s initial FOG bias: KVH turn-on offset +-20 deg/h, measured -25..+28 deg/h per session (R5); old 1e-5 tied on score but cannot absorb the offset [datasheet, R7a]
    wheel_scale: 0.0044              # wheel-scale sigma: residual std of the date trend; with wheel.scale_consider it is never updated, only carried in the covariance (R6: estimating it online absorbed other errors) [measured]

  wheel:                             # forward wheel-speed update
    enabled: true                    # use wheel speeds
    sigma_mps: 0.15                  # m/s measurement noise of the mean wheel speed [tuned]
    speed_scale: null                # released speed / true speed; null = date trend below (or calibration value 1.054 if the trend is off) [measured]
    scale_trend_enabled: true        # fixed per-session scale from a linear trend in date; online estimation absorbed other errors (R6) (user decision) [design]
    scale_trend_ref_date: 2012-01-01 # date where the trend equals the intercept [design]
    scale_trend_intercept: 1.04409   # scale at the reference date; scripts/fit_wheel_scale_trend.py, 22 training days, residual std 0.0044 [measured]
    scale_trend_per_year: 0.03268    # scale increase per year (tyre wear/pressure); validation days within 0.4% [measured]
    scale_consider: true             # Schmidt consider state: scale fixed at the trend value, its uncertainty (prior.wheel_scale) kept in the covariance for honest dead reckoning (user decision) [design]
    gate_prob: 0.999                 # chi-square acceptance probability for gating [design]
    encoder_pitch_coef_m: 0.24       # m; encoders sense wheel rotation relative to the chassis: reported speed += R_w * pitch rate; data 0.17-0.24 m ~ wheel radius; 2x2 test: velocity error -15%, drift -12% [measured, kept]

  nonholonomic:                      # soft pseudo-measurement: axle does not slide sideways/vertically
    enabled: true                    # on in baseline A (user decision, Phase 3 review)
    sigma_lateral_mps: 0.2           # m/s allowed lateral axle velocity (along the axle; pitch-independent); 0.1 / 0.05 worse (R7b); NIS 0.18 = under-confident, revisit in R8 [tuned, R7b]
    vertical_mode: "grade"           # R7b winner (level nearly tied, off clearly worse: p95 11.9 vs 8.0 m); off | body (body-z velocity ~ 0; biased by v*sin(pitch)) | level (world-vertical axle velocity ~ 0; pitch-independent) | grade (axle follows an estimated terrain slope: v_D = -grad(h) . v_horizontal) [decided in R7b]
    sigma_vertical_mps: 0.1          # m/s, used when vertical_mode is body, level or grade (level: covers slopes of a few %) [design]
    grade_prior_sigma: 0.05          # initial terrain-gradient sigma per axis (rise/run); campus |grade| median 1.3%, p99 9% [measured]
    grade_rw_per_sqrt_m: 0.01        # terrain-gradient random walk per sqrt(metre travelled): ~3% change over 10 m [design]
    gate_prob: 0.999                 # chi-square acceptance probability [design]

  gnss:                              # horizontal GPS position update
    enabled: true                    # use GPS
    sigma_m: 5.0                     # m per-axis noise, inflated for time-correlated error [tuned]
    gate_prob: 0.999                 # chi-square acceptance probability [design]
    skip_held: true                  # ignore repeated (held) fixes: no new information [design]
    min_interval_s: 1.0              # s minimum spacing between GPS updates (1 Hz) [tuned]
    error_state: false               # model the time-correlated GPS error as 2 Gauss-Markov states (overconfidence fix; compare in R7) [design]
    error_gm_sigma_m: 2.53           # m stationary sigma of the correlated GPS error [measured, Phase 2 fit]
    error_gm_tau_s: 55.0             # s correlation time of the GPS error [measured, Phase 2 fit]
    error_white_sigma_m: 1.44        # m remaining white GPS noise per axis, used instead of sigma_m when error_state is on [measured, Phase 2 fit]
    recovery_after_s: 300.0          # s of continuous rejection before re-acquisition; 90 s accepted gross episodes [tuned]
    recovery_min_rejections: 5       # consecutive rejected fixes also required before re-acquisition [design]
    recovery_pos_sigma_m: 30.0       # m position sigma set at re-acquisition [design]
    reacq_enabled: true              # after a GPS gap, accept GPS only once several consistent, plausible fixes agree (user decision) [design]
    reacq_trigger_s: 5.0             # s without an accepted fix that starts re-acquisition (= natural-outage threshold) [design]
    reacq_min_fixes: 5               # consecutive gated fixes required before trusting GPS again [design; tune R7]
    reacq_window_s: 10.0             # s; those fixes must lie within this window (with 1 Hz updates: ~5 s) [design]
    reacq_consistency_m: 5.0         # m; max deviation of each candidate innovation from their mean [design; tune R7]
    reacq_max_offset_m: 10.0         # m; allowed mean innovation right after a gap [design]
    reacq_offset_growth_mps: 0.1     # m/s; allowed mean innovation grows with gap length; observed drift ~0.04 m/s median (5 m per 2 min), p90 ~0.1 [measured; tune R7]

  wheel_scale_chain:                 # wheel scale carried across sessions by date (user decision, Phase 1/3 review; R6)
    enabled: false                   # true: estimate wheel scale as a slow state initialised from the previous session
    first_value: 1.0                 # wheel scale at the first session (2012-01-08) [user decision]
    first_sigma: 0.05                # 1-sigma at the first session (true values 1.04-1.09) [design]
    sigma_floor: 0.005               # minimum carried-over 1-sigma (possible tyre changes between runs) [design]
    sigma_growth_per_day: 0.0005     # 1-sigma added per day since the previous session (wear/pressure; ~0.003/month observed) [measured, generous]

  fog_handling:                      # causal FOG angle at propagation-interval boundaries
    max_extrapolation_s: 0.05        # s; if the last FOG sample is older, the interval uses the IMU gyro only [design]
    extrapolation_baseline_s: 0.02   # s minimum span for the extrapolation rate (samples can be 0.1 ms apart) [measured]

  init:
    start_offset_s: 1.0              # s after the first valid reference pose where runs start [design]

  use_fog: true                      # fuse the FOG for body-z rotation (false = IMU gyro only)
  earth_rotation: true               # remove the Earth rate sensed by gyro and FOG (~10.1 deg/h on the local vertical); per-session FOG/gyro offsets are left to the bias states (user decision, Phase 3 review) [physics]
  output_every: 1                    # emit an estimate every n-th IMU step

data:
  limits:                            # row validity flags (generous physical bounds, not tuning)
    max_specific_force_mps2: 60.0    # m/s^2 accelerometer norm above this = out of range
    max_angular_rate_radps: 10.0     # rad/s gyro axis above this = out of range
    max_wheel_speed_mps: 5.0         # m/s wheel speed above this = out of range
    min_gps_fix_mode: 2              # GPS fix mode below this = no fix (paper Table 7)
  node_match_tolerance_s: 0.05       # s; graph nodes without a dense pose this close are invalid (truncated releases) [measured]
  velocity_half_window_s: 0.05       # s half-window of the central difference for reference velocity [design]
  max_reference_speed_mps: 5.0       # m/s reference speeds above this are masked as implausible [design]

evaluation:
  max_staleness_s: 0.2               # s; reference times with no estimate this recent count as not covered [design]
  dense_rate_hz: 10.0                # Hz grid for dense (sensitivity) scoring, RPE and outage curves [design]
  score_start_after_init_s: 10.0     # s after run start before scoring begins [design]
  rpe_deltas_s: [10.0, 60.0]         # s intervals for relative pose error (drift); computed on graph nodes (primary, LiDAR/RTK-anchored; user decision) and on the dense reference (sensitivity) [design]
  outages:
    durations_s: [30.0, 60.0, 120.0] # s injected outage lengths (user decision: report with natural outages)
    per_duration: 3                  # injected windows per duration per session
    min_separation_s: 180.0          # s between windows and of healthy GPS before each [design]
    max_natural_gap_s: 2.0           # s; candidate windows must not contain natural GPS gaps longer than this
    earliest_start_after_init_s: 60.0  # s; no injected outage before this time after run start
    natural_min_gap_s: 5.0           # s; GPS gaps longer than this count as natural outages
    curve_offsets_s: [0, 5, 10, 20, 30, 45, 60, 90, 120]  # s after outage start where error is sampled
    curve_sample_tolerance_s: 3.0    # s; nearest reference sample must be this close to an offset

training:                            # method B: learned noise and constants (Phase 4; plans/PHASE_4_TRAINING.md). Anchors = the filter values above (baseline A)
  device: cpu                        # the filter needs float64; Apple MPS has none (D3) [design]
  dtype: float64                     # filter precision during training; float32 only as a gated experiment (plan section 5) [design]
  batch_size: 64                     # chunks stepped in parallel by the batched masked runner; 32-128, set from the speed measurement [design]
  seeds_dev: [0]                     # seeds during development (D6) [design]
  seeds_report: [0, 1, 2]            # seeds for reported comparisons (D6) [design]

  windows:                           # truncated backpropagation (D3)
    burn_in_s: 20.0                  # s run without gradient from A's cached state/covariance so the state adapts to B's values (user decision) [design]
    loss_window_s: 10.0              # s window with backpropagation and loss (user decision) [design]
    carry_state: true                # continue chunks chronologically, state carried with gradients detached [design]
    grad_through_burn_in: true       # gradient also flows through the burn-in (loss still only on the loss window): with a no-gradient burn-in the GPS-sigma gradient missed most of its effect (pilot check: -0.009 vs 0.29 full) [measured, pilot]

  optimizer:                         # D6
    name: adamw                      # optimiser on the deviation parameters [design]
    lr: 1.0e-2                       # peak learning rate (user decision: start larger) [design]
    lr_final: 1.0e-4                 # learning rate at the end of the cosine decay [design]
    warmup_steps: 20                 # linear warm-up steps from 0 to lr [design]
    schedule: cosine                 # decay after warm-up [design]
    weight_decay: 0.0                # none: the anchor penalty already pulls deviations to 0 [design]
    grad_clip_norm: 1.0              # global gradient-norm clip [design]

  early_stopping:                    # validation-day full replays (D6)
    max_steps: 2000                  # optimiser steps at most; revisit after the speed measurement [design]
    val_every_steps: 100             # steps between validation replays [design]
    patience: 5                      # validation replays without improvement before stopping [design]

  loss:                              # loss = (1 - alpha) * task + alpha * innovation NLL + anchor penalty (D2)
    innovation_nll_weight: 0.0       # alpha; 0 = task loss only (user decision: start fully on the normalised error) [design]
    huber_delta: 2.0                 # Huber threshold in normalised units: larger errors count linearly (robust to rare GPS-driven errors) [design]
    pos_scale_m: 3.0                 # m normalisation of horizontal position error at graph nodes (A's median ~3 m) [measured, Phase 3]
    heading_scale_rad: 0.03          # rad normalisation of wrapped heading error (A's ~1.8 deg) [measured, Phase 3]
    vel_scale_mps: 0.2               # m/s normalisation of horizontal velocity error vs the dense reference (A's RMSE ~0.2) [measured, Phase 3]
    pos_weight: 1.0                  # task-loss channel weight, position [design]
    heading_weight: 1.0              # task-loss channel weight, heading [design]
    vel_weight: 1.0                  # task-loss channel weight, velocity [design]
    anchor_penalty_weight: 1.0       # weight of sum (delta / sigma_anchor)^2 (Gaussian prior on the physics) [design]

  anchor_sigma:                      # prior width of each learned deviation delta (D1); log units for value = anchor * exp(delta), else additive
    gnss_sigma: 0.7                  # log; white GPS sigma (0.7 ~ factor 2) [design]
    wheel_sigma: 0.7                 # log; wheel-speed sigma [design]
    lateral_sigma: 0.7               # log; lateral-constraint sigma [design]
    vertical_sigma: 0.7              # log; vertical-constraint sigma (only if vertical_mode is not off) [design]
    acc_noise_density: 0.7           # log; accelerometer white noise (Phase 3 optimum flat 0.05-0.2) [tuned]
    gyr_noise_density: 0.7           # log; MEMS gyro white noise [design]
    fog_angle_random_walk: 0.35      # log; FOG angle random walk (datasheet value, tighter) [datasheet]
    grade_rw: 0.7                    # log; terrain-gradient random walk (only if vertical_mode is grade) [design]
    wheel_scale_offset: 0.01         # additive offset to the per-session date-trend scale (stage 2); ~2x the trend residual 0.0044 [measured, generous]
    encoder_pitch_coef_m: 0.04       # m additive, R_w (stage 2); anchor 0.24, data 0.17-0.24 m [measured]

  slow_grid:                         # slow parameters: full-session replays, no gradient (D7, user decision)
    fog_bias_prior_radps: [3.0e-5, 1.0e-4, 3.0e-4]  # round 1: initial FOG bias sigma, rad/s (anchor 1e-4) [design]
    fog_bias_rw: [3.0e-7, 1.0e-6, 3.0e-6]  # round 1: FOG bias random walk, rad/s/sqrt(s) (anchor 1e-6) [design]
    gnss_error_sigma_m: [1.5, 2.53]  # round 2: correlated GPS error sigma with error states on, m (Phase 2 fit 2.53) [design]
    gnss_error_tau_s: [20.0, 55.0]   # round 2: correlation time, s (Phase 2 fit 55) [design]
    round2_fog_bias_rw_factors: [0.333, 1.0, 3.0]  # round 2: factors on the best round-1 FOG bias random walk [design]
    round3_enabled: true             # round 3: gyro and accelerometer bias random walks, one at a time [design]
    round3_bias_rw_factors: [0.333, 3.0]  # round 3: factors on each anchor [design]

  pilot:                             # quick method-B pilot (learns GPS, wheel and lateral sigma only); scripts/phase4_pilot.py
    n_sessions: 9                    # training days used, spread evenly over the training dates (one process each) [design]
    snapshot_every_s: 30.0           # s spacing of A's cached chunk starts (chunk = burn-in + loss window) [design]
    steps: 40                        # optimiser steps [design; from the pilot timing]
    lr: 0.05                         # peak learning rate (few steps, so larger than training.optimizer.lr) [design]
    warmup_steps: 5                  # linear warm-up, then cosine decay to training.optimizer.lr_final [design]
    chunks_per_step: 18              # chunks per optimiser step (gradient averaged) [design]
    workers: 9                       # parallel processes, one chunk each (10 cores) [design]
